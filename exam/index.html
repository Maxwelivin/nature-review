<header>

<script>
// 測驗卷「解答講解版」：不收錄題目、選項與圖片，只有題號、答案與自編講解
// E(回id, 標題, 範圍) 新增一回；G(題組提示) 設定題組；Q(題型, 題號, 考點, 答案, 講解, 提醒)
const EXAMS = [];
let _E, _G = null;
function E(id, title, range) { _E = { id, title, range, qs: [] }; EXAMS.push(_E); _G = null; }
function G(t) { _G = t || null; }
function Q(sec, n, topic, ans, exp, tip) { _E.qs.push({ sec, n, topic, ans, exp, tip: tip || '', grp: _G }); }
const GCM = 'g/cm<sup>3</sup>', CM3 = 'cm<sup>3</sup>';

/* ================= 第 1 回 ================= */
E(1, '第 1 回', '實驗室常用器材、1-1～1-3');
Q('選擇', 1, '由測量結果反推最小刻度', 'B', '測量結果的最後一位是估計值，往前一位才是尺上真的有的刻度。12.345 m 的最後一位 5 是估計的，往前一位是 0.01 m，所以最小刻度是 0.01 m（也就是 1 cm）。');
Q('選擇', 2, '認識實驗器材', 'A', '看清楚每個器材的外形和名稱：燒杯是有刻度、口有凸嘴的杯子；刮勺是取用固體藥品的小勺；坩堝鉗是夾取高溫坩堝的長夾子。只有甲的名稱和圖相符。', '💡 器材名稱常考：量筒、燒杯、錐形瓶、試管夾、坩堝鉗、刮勺、砝碼夾。');
Q('選擇', 3, '不同單位的最小刻度比較', 'D', '每個數據都去掉最後一位估計值，看倒數第二位的單位：<br>甲 3.461 m → 0.01 m（cm）；乙 78.2 m → 1 m；丙 342.5 mm → 1 mm。三個都不一樣。', '⚠ 丙的單位是 mm，不要和甲、乙的 m 混在一起比。');
Q('選擇', 4, '砝碼的取用', 'C', '砝碼要用砝碼夾夾取。手上的汗水和油脂會讓砝碼生鏽或沾上髒東西，質量就不準了，擦乾手或隔著紙拿都不行。');
Q('選擇', 5, '測量結果的位數', 'D', '最小刻度 1 mm＝0.1 cm，所以準確到 0.1 cm，再多估一位到 0.01 cm。用 cm 記錄時，小數點後應該剛好有兩位：13.42 cm。', '⚠ 位數不是越多越準，多寫的位數沒有意義。');
Q('選擇', 6, '最小刻度 1 cm 的直尺讀數', 'B', '這把尺只有每 1 cm 一格，所以只能準確到 1 cm，再估一位到 0.1 cm。筆尖落在 14 和 15 之間，要寫成 14.? cm，小數點後只有一位，就是 14.7 cm。');
Q('選擇', 7, '質量相同時比較體積', 'C', '體積＝質量 ÷ 密度。質量一樣時，密度越小，體積就越大。三種金屬的密度：鐵 7.8＜銅 8.9＜鉛 11.3，所以體積是鐵球＞銅球＞鉛球。', '💡 同質量：密度小的「佔空間大」。');
Q('選擇', 8, '找出估計值', 'A', '測量結果數字的最後一位就是估計值。162.5 的最後一位是 5。');
Q('選擇', 9, '溶解時質量不變', 'C', '方糖溶在水裡只是看不見了，糖並沒有消失，左盤的總質量沒有改變，所以天平還是平衡的。');
Q('選擇', 10, '測量的基本觀念', 'B', '估計值只能有一位，就是最小刻度的下一位。寫越多位估計值並不會更準，反而是錯誤的記錄方式。其他三項都正確。');
Q('選擇', 11, '密度是物質的特性', 'C', '甲、乙都是鐵，同一種物質的密度一樣，和大小、質量無關，所以密度比是 1：1。', '⚠ 質量比是 2：1，但題目問的是密度。');
Q('選擇', 12, '從圖讀出密度', 'C', '在圖上找一個清楚的點，用質量除以體積：75 g ÷ 25 cm<sup>3</sup>＝3 g/cm<sup>3</sup>。');
Q('選擇', 13, '砂子的真正體積', 'A', '砂粒之間有空隙，所以量筒上讀到的 67.50 mL 包含空氣，不是砂子的真正體積。倒入 100 mL 的水把空隙填滿後，總體積是 159.30 mL，所以砂子＝159.30－100＝59.30 cm<sup>3</sup>。', '💡 砂的體積＋倒入的水＝最後的總體積。');
Q('選擇', 14, '用非標準單位測量', 'D', '用食指寬當單位時，「一個食指寬」就是最小刻度，只能再估一位到小數點後第一位。寫 3.35 多估了一位，不合理。');
Q('選擇', 15, '用增加量求液體密度', 'C', '總質量裡有量筒，所以要看「增加了多少」：質量多了 395－370＝25 g，體積多了 110－100＝10 cm<sup>3</sup>，密度＝25 ÷ 10＝2.5 g/cm<sup>3</sup>。');
Q('選擇', 16, 'm–V 圖比較密度', 'A', '在質量–體積圖上，直線越陡（斜率越大），密度越大。取同一個體積看，甲的質量最大，所以甲的密度最大。');
Q('選擇', 17, '同一物質：體積變、密度不變', 'A', '兩杯都是 25 ℃ 的水，密度相同。乙杯水比較多，所以質量比較大，但密度不會因為水多而改變。');
Q('選擇', 18, '求空量筒的質量', 'D', '液體多了 20 mL，質量多了 76－60＝16 g，所以每 10 mL 液體是 8 g。一開始裝 10 mL 時總共 60 g，扣掉液體 8 g，空量筒＝52 g。');
Q('選擇', 19, '公式法與排水法', 'B', '只有形狀規則的物體（例如長方體、圓柱）才能用公式算體積。形狀不規則的物體，就算會沉入水中，也要用排水法量。');
Q('選擇', 20, '去除不合理數據後取平均', 'C', '36.7 和其他人差了 10 公分以上，明顯是量錯了，要先刪掉。剩下四筆取平均：（25.9＋25.8＋26.0＋25.9）÷ 4＝25.9 公分。', '⚠ 平均之前先檢查有沒有特別離譜的數據。');
G('題組：上皿天平的校準與使用（第 1～2 題）');
Q('題組', 1, '天平歸零：調校準螺絲', 'A', '指針偏左，代表左邊比較重。要讓右邊變重，就把校準螺絲往右邊移。可以只把右邊的 b 往右旋、只把左邊的 a 往右旋，或兩個一起往右旋。');
Q('題組', 2, '測量時指針偏向的處理', 'A', '指針偏右，代表右盤的砝碼太重，要拿掉一些砝碼。開始測量後就不能再轉校準螺絲。', '⚠ 校準螺絲只在「歸零」時使用。');
G('題組：用量筒測量水的體積（第 3～5 題）');
Q('題組', 3, '測量液體體積的器材', 'B', '量液體體積要用量筒，刻度比較精細。燒杯上的刻度只是大約的值。');
Q('題組', 4, '量筒的正確讀法', 'C', '眼睛要和液面同高，看凹液面中央的最低處。請在考卷上找出視線水平、且對準最低處的那位同學。');
Q('題組', 5, '仰視與俯視的誤差', 'D', '從下往上看（仰視）讀到的數字會偏小；從上往下看（俯視）會偏大。題目問偏小，要找仰視的那位同學。', '💡 口訣：「俯大仰小」。');
G();
Q('素養', 1, '用重物幫助浮體下沉測體積', 'D', '桌球會浮起來，所以綁上鐵塊把它拉下去。V<sub>2</sub> 只有鐵塊在水中，V<sub>3</sub> 是鐵塊加桌球，兩者相減就是桌球的體積：247.0－230.0＝17.0 cm<sup>3</sup>。');
Q('素養', 2, '用密度判斷同種物質', 'B', '分別算密度：甲 39 ÷ 5＝7.8；乙 67.5 ÷ 25＝2.7；丙 156 ÷ 20＝7.8（g/cm<sup>3</sup>）。甲和丙的密度相同，可能是同一種物質。');
G('題組：液體體積與總質量的關係圖（第 3～5 題）');
Q('素養', 3, '用圖上兩點求液體密度', 'D', '圖上的質量包含量筒，所以取兩個點相減：質量差 42－38＝4 g，體積差 15－10＝5 cm<sup>3</sup>，密度＝4 ÷ 5＝0.8 g/cm<sup>3</sup>。');
Q('素養', 4, '直線與縱軸的交點', 'C', 'm<sub>0</sub> 是液體體積為 0 時的質量，也就是空量筒的質量。10 cm<sup>3</sup> 液體是 10 × 0.8＝8 g，所以量筒＝38－8＝30 g。');
Q('素養', 5, '預測總質量', 'C', '總質量＝量筒＋液體＝30＋40 × 0.8＝30＋32＝62 g。');

/* ================= 第 2 回 ================= */
E(2, '第 2 回', '2-1 物質的形態、性質與變化／空氣');
Q('選擇', 1, '化學變化與物理變化', 'D', '汽水沒氣泡，只是溶在水裡的二氧化碳跑出來了，沒有產生新物質，屬於物理變化。食物變質、生鏽、燃燒都會產生新物質，屬於化學變化。');
Q('選擇', 2, '判斷化學變化', 'B', '牛奶變酸是因為產生了新的物質，屬於化學變化。杯外的水滴（凝結）、磨成粉（形狀改變）、露珠消失（蒸發）都只是狀態或外形改變。', '💡 判斷關鍵：有沒有「新物質」產生。');
Q('選擇', 3, '熔化再製與氧化保護層', 'B', '鋁罐熔化再做成新罐子，還是鋁，屬於物理變化。鋁和氧氣反應產生一層新的物質（保護層），屬於化學變化。');
Q('選擇', 4, '吸入與呼出氣體的成分', 'A', '空氣中最多的是氮氣（約 78%）。人體不會使用氮氣，吸進去多少就呼出多少，所以呼出的氣體裡最多的還是氮氣。', '⚠ 呼出氣體中二氧化碳雖然變多了，但仍然比氮氣少很多。');
Q('選擇', 5, '從性質是否固定判斷混合物', 'B', '純物質的密度、熔點、沸點都是固定的一個值。密度是「1.2～1.8」一個範圍，代表成分比例會變，是混合物。');
Q('選擇', 6, '二氧化碳的性質', 'B', '二氧化碳不能燃燒，也不幫助燃燒，所以可以用來滅火。它會稍微溶於水，不是完全不溶；生物呼吸需要的是氧氣。');
Q('選擇', 7, '燒紅菜刀放入水中', 'D', '高溫讓水快速變成水蒸氣（汽化），水蒸氣往上飄、遇到冷空氣，又凝結成小水滴，就是看到的白煙。');
Q('選擇', 8, '辨認蒸發現象', 'B', '冰水杯外的水滴是空氣中的水蒸氣遇冷凝結，不是蒸發。牛奶加熱後水位下降、流汗吹風覺得涼，都是水蒸發造成的。');
Q('選擇', 9, '冬天說話的白霧', 'B', '嘴裡呼出的氣體含有水蒸氣，遇到冬天的冷空氣就凝結成小水滴，看起來是白色的霧。');
Q('選擇', 10, '化學變化的特徵', 'C', '化學變化會產生新物質，所以物質的組成改變了，性質也跟著改變。物理變化則是組成和性質都不變。');
Q('選擇', 11, '空氣的組成與用途', 'B', '液態氮的溫度非常低，可以當冷凍劑。空氣含有很多種氣體，是混合物；二氧化碳的含量會隨地點、時間改變。');
Q('選擇', 12, '薊頭漏斗要插入液面下', 'B', '薊頭漏斗的管子如果沒有插到液體裡，產生的氧氣會從漏斗口直接跑掉，收集不到。管口泡在液體裡就等於把出口封住了。');
Q('選擇', 13, '加速蒸發的方法', 'B', '烘碗機是用加熱讓水快速蒸發，吹風機吹熱風也是一樣的原理（提高溫度）。把積水拖開是增加表面積，原理不一樣。');

Q('素養', 1, '天平平衡代表質量相等', 'C', '天平平衡，代表兩邊質量一樣。甲的體積比較大，同樣的質量分散在更大的空間裡，所以甲的密度比乙小。');
Q('素養', 2, '冰熔化成水的體積', 'C', '50 cm<sup>3</sup> 的冰，質量＝50 × 0.9＝45 g；熔化成水後質量不變，水的密度是 1，所以體積變成 45 cm<sup>3</sup>。杯中總共 350＋45＝395 c.c.。');
Q('素養', 3, '從表格分析液體與量筒', 'C', '從表格數據相減，算出液體密度是 0.8 g/cm<sup>3</sup>，量筒是 32 g。30 cm<sup>3</sup> 的液體質量＝30 × 0.8＝24 g。密度是物質的特性，不會隨質量改變。');
Q('素養', 4, '兩杯飽和溶液', 'D', '兩杯都有鹽沒溶完，都是飽和溶液，同溫下濃度相同，混在一起濃度也不變。剩下的鹽都是 2 g，要溶掉它們需要的水量也一樣。');
Q('素養', 5, '由飽和濃度求水量', 'B', '濃度 50% 代表溶質和水一樣重。40 g 的甲物質要剛好飽和，就需要 40 g 的水：40 ÷（40＋40）＝50%。');

// 轉成與習作頁相同的結構
const SECNAME = { '選擇': '一、選擇題', '題組': '二、題組', '素養': '三、素養題' };
const CHS = EXAMS.map(x => ({ id: x.id, title: x.title, range: x.range,
  secs: ['選擇', '題組', '素養'].filter(k => x.qs.some(q => q.sec === k)).map(k => ({ name: SECNAME[k] })),
  qs: x.qs.map(q => ({ ...q, sec: SECNAME[q.sec], page: x.title })) }));

</script>
<script>
const L = 'ABCDEFGH';
const seen = new Set();
let ch = 0, cur = 0;   // 目前的章、題目索引

function renderTabs() {
  document.getElementById('etabs').innerHTML = CHS.map((c, k) =>
    `<button class="${k === ch ? 'on' : ''}" data-c="${k}">${c.title}</button>`).join('');
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => show(+b.dataset.c, 0));
}

function renderSide() {
  const c = CHS[ch];
  let html = `<div class="rng">${c.title}：${c.range}</div>`;
  c.secs.forEach(s => {
    html += `<div class="sec">${s.name}</div><div class="dots">${c.qs.map((q, k) => q.sec !== s.name ? '' :
      `<button class="dot ${k === cur ? 'cur' : seen.has(ch + '-' + k) ? 'seen' : ''}" data-k="${k}">${q.n}</button>`).join('')}</div>`;
  });
  html += `<div class="tip">👆 點題號看題目與詳解<br>⌨️ 鍵盤 ← → 可換題</div>`;
  const side = document.getElementById('side');
  side.innerHTML = html;
  side.querySelectorAll('.dot').forEach(b => b.onclick = () => show(ch, +b.dataset.k, true));
}

function graphSvg() {
  // 依習作表格數據畫 m–V 圖（自繪參考答案）
  const V = [10, 20, 30, 40, 50], M = [27, 39, 51, 63, 75];
  const X = v => 50 + v * 5.5, Y = m => 260 - m * 2.8;
  let s = '<svg class="graph" viewBox="0 0 470 300" font-size="12" font-family="sans-serif">';
  for (let v = 0; v <= 60; v += 10) s += `<line x1="${X(v)}" y1="${Y(0)}" x2="${X(v)}" y2="${Y(80)}" stroke="#e5e7eb"/><text x="${X(v)}" y="${Y(0) + 16}" text-anchor="middle">${v}</text>`;
  for (let m = 0; m <= 80; m += 10) s += `<line x1="${X(0)}" y1="${Y(m)}" x2="${X(60)}" y2="${Y(m)}" stroke="#e5e7eb"/><text x="${X(0) - 6}" y="${Y(m) + 4}" text-anchor="end">${m}</text>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(62)}" y2="${Y(0)}" stroke="#333"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(84)}" stroke="#333"/>`;
  s += `<text x="${X(62)}" y="${Y(0) + 4}">V（cm³）</text><text x="${X(0) - 10}" y="${Y(84) - 4}">m（g）</text>`;
  s += `<line x1="${X(0)}" y1="${Y(15)}" x2="${X(54)}" y2="${Y(15 + 1.2 * 54)}" stroke="#dc2626" stroke-width="2"/>`;
  V.forEach((v, i) => s += `<circle cx="${X(v)}" cy="${Y(M[i])}" r="4" fill="#dc2626"/>`);
  s += `<text x="${X(4)}" y="${Y(15) + 22}" fill="#dc2626">← 交在 15 g（量筒質量）</text></svg>`;
  return s;
}

function renderQ() {
  const c = CHS[ch], q = c.qs[cur];
  const si = c.secs.findIndex(s => s.name === q.sec);
  seen.add(ch + '-' + cur);
  const isLetter = /^\(?[A-H]\)?$/.test(q.ans);
  const tip = q.tip ? `<div class="tipbox ${q.tip.startsWith('⚠') ? 'warn' : 'idea'}">${q.tip}</div>` : '';
  const box = document.getElementById('q');
  box.innerHTML = `<div class="qcard">
    <div class="qmeta"><span class="tag t${si}">${q.sec}</span><b>第 ${q.n} 題</b>
      <span class="pg">${q.page}</span></div>
    <div class="book">📝 請拿出<b>${q.page}測驗卷</b>，找到「${q.sec}」第 <b>${q.n}</b> 題，先自己訂正再看解答。</div>
    ${q.grp ? `<div class="grp">${q.grp}</div>` : ''}
    <div class="topic">🎯 考點：${q.topic}</div>
    <div class="ans">✔ 答案：${isLetter && !q.ans.startsWith('(') ? '(' + q.ans + ')' : q.ans}</div>
    <div class="exp"><span class="lbl">📘 講解：</span>${q.exp}${q.svg === 'graph' ? graphSvg() : ''}</div>
    ${tip}
    <div class="nav">
      <button class="btn gray" id="prev" ${cur ? '' : 'disabled'}>← 上一題</button>
      <span class="sp">${cur + 1} / ${c.qs.length}</span>
      <button class="btn" id="next" ${cur < c.qs.length - 1 ? '' : 'disabled'}>下一題 →</button>
    </div></div>`;
  document.getElementById('prev').onclick = () => show(ch, cur - 1);
  document.getElementById('next').onclick = () => show(ch, cur + 1);
}

function show(c, k, fromSide) {
  ch = c; cur = Math.min(Math.max(k, 0), CHS[ch].qs.length - 1);
  renderTabs(); renderQ(); renderSide();
  // 手機版題號在上方，點題號後捲到題目
  if (fromSide && window.innerWidth <= 820) document.getElementById('q').scrollIntoView({ behavior: 'smooth' });
  else window.scrollTo(0, 0);
}

function zoom(src) {
  const z = document.getElementById('zoom');
  z.querySelector('img').src = src; z.classList.remove('hidden');
}
document.getElementById('zoom').onclick = () => document.getElementById('zoom').classList.add('hidden');

document.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowRight') show(ch, cur + 1);
  else if (ev.key === 'ArrowLeft') show(ch, cur - 1);
  else if (ev.key === 'Escape') document.getElementById('zoom').classList.add('hidden');
});

show(0, 0);
</script>
</body>
</html>
