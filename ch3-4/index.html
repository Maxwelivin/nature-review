<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">

<title>國中自然 2上｜第3、4章 段考複習（檢核＋複習）</title>
<style>:root{
  --bg:#f5f7fa;--card:#fff;--line:#dfe4ea;--text:#1d2733;--text2:#46566a;--muted:#6b7a8c;
  --c3:#0e7c86;--c3s:#e3f4f5;--c4:#5b45b8;--c4s:#ece8fa;--good:#1f8a4c;--goods:#e6f5ec;--bad:#c62828;--bads:#fdecec;--warn:#b26a00;--warns:#fff4dc;
  --sh:0 1px 3px rgba(20,40,70,.08),0 4px 14px rgba(20,40,70,.05);--r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--c3)}
h1,h2,h3,h4{line-height:1.4;margin:.2em 0 .5em}
h2{font-size:24px} h3{font-size:19px} h4{font-size:16.5px}
p{margin:.5em 0}
.muted{color:var(--muted);font-size:14.5px}
/* 上方列 */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(20,40,70,.06)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;color:var(--text);text-decoration:none;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:6px;margin-left:auto}
.nav a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--text2);font-weight:700;border:1.5px solid transparent;white-space:nowrap}
.nav a.on{background:var(--c3);color:#fff}
.nav a:hover:not(.on){border-color:var(--line)}
.me{font-size:13.5px;color:var(--text2);white-space:nowrap}
.pbar{height:6px;background:#e7ebf0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--good));transition:width .4s}
main{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grow{flex:1;min-width:0}
.btn{font:inherit;font-weight:700;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.5}
.btn:hover{border-color:var(--c3)}
.btn.primary{background:var(--c3);border-color:var(--c3);color:#fff}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:var(--warns);border-color:#e6b95c;color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;width:120px}
.in.wide{width:190px;font-size:18px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--c3s);color:var(--c3)}
.chip.c4{background:var(--c4s);color:var(--c4)}
.chip.gray{background:#eef1f5;color:var(--text2)}
/* 首頁 */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.hero a{display:block;text-decoration:none;color:var(--text);border-radius:18px;padding:22px 22px 18px;border:2px solid var(--line);background:#fff;box-shadow:var(--sh)}
.hero a:hover{transform:translateY(-2px)}
.hero .h1{border-color:#9fd2d6;background:linear-gradient(180deg,#f2fbfb,#fff)}
.hero .h2{border-color:#c5baf0;background:linear-gradient(180deg,#f6f3ff,#fff)}
.hero a>b{font-size:22px;display:block}
.hero span{color:var(--text2);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}
.steps div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.steps b{display:block;color:var(--c3)}
.ident .row{margin:6px 0 0}
.prog-big{display:flex;gap:18px;align-items:center}
.prog-big .num{font-size:40px;font-weight:800;color:var(--good);line-height:1}
.prog-big .num small{font-size:20px;color:var(--text2);font-weight:600}
/* 章節與任務列表 */
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.sec-h h3{margin:0}
.sec-h .sp{margin-left:auto;font-size:14px;color:var(--muted)}
.ch-h{margin:28px 0 4px;padding:8px 14px;border-radius:12px;color:#fff;font-size:20px;font-weight:800}
.ch-h.c3{background:var(--c3)} .ch-h.c4{background:var(--c4)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin:8px 0}
.tk{display:block;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-left:6px solid var(--c3);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.tk.c4{border-left-color:var(--c4)}
.tk:hover{transform:translateY(-2px)}
.tk.done{background:var(--goods);border-left-color:var(--good)}
.tk .tt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tk h4{margin:6px 0 4px;font-size:16px}
.tk .codes{font-size:12.5px;color:var(--muted)}
.st{font-size:13px;font-weight:700;white-space:nowrap}
.st.ok{color:var(--good)} .st.go{color:var(--c4)} .st.no{color:var(--muted)} .st.hint{color:var(--warn)}
.tk .tl2{display:flex;gap:6px;margin-top:8px}
.tk .tl2 a{font-size:13px;font-weight:700;padding:2px 10px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--text2)}
/* 作答 */
.streak{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:700;color:var(--text2)}
.streak i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff}
.streak i.on{background:var(--good);border-color:var(--good)}
.q-stem{font-size:18px;line-height:1.85;margin-top:0}
.svgbox{margin:8px 0;text-align:center}
.svgbox svg{max-width:100%;height:auto}
.q-opts{display:grid;gap:8px;margin:6px 0}
.q-opt{font:inherit;text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;line-height:1.6}
.q-opt:hover:not(:disabled){border-color:var(--c3)}
.q-opt.sel{border-color:var(--c3);background:var(--c3s);font-weight:700}
.q-opt.is-right{border-color:var(--good);background:var(--goods)}
.q-opt.is-wrong{border-color:var(--bad);background:var(--bads)}
.step{margin:12px 0 4px;font-weight:700;color:var(--text2)}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;line-height:1.75}
.fb.ok{background:var(--goods);border:1.5px solid var(--good)}
.fb.no{background:var(--bads);border:1.5px solid var(--bad)}
.fb p{margin:4px 0}
.pass-box{margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--goods);border:2px solid var(--good)}
.rv-box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--warns);border:1.5px solid #e6b95c}
.warn-box{padding:12px 16px;border-radius:12px;background:var(--bads);border:2px solid var(--bad);margin:10px 0}
/* 複習卡 */
.rcard h2{margin-top:6px}
.rcard .goal{font-size:17px;font-weight:700;margin:2px 0 8px}
.kp{margin:10px 0;padding:12px 16px;border-left:5px solid var(--c3);background:var(--c3s);border-radius:0 12px 12px 0}
.kp.c4{border-left-color:var(--c4);background:var(--c4s)}
.kp b.t{display:block;margin-bottom:2px}
.trap{margin:10px 0;padding:12px 16px;border-left:5px solid var(--bad);background:var(--bads);border-radius:0 12px 12px 0}
.trap ul,.kp ul{margin:4px 0 4px 1.2em;padding:0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:center;vertical-align:middle}
table.t th{background:#eef2f7}
table.t td.l{text-align:left}
.tbl-scroll{overflow-x:auto}
details.qc{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff}
details.qc summary{cursor:pointer;font-weight:700}
.nav2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px 0}
/* 模擬 */
.sim{margin:14px 0;border:2px solid #b9c7d8;border-radius:16px;background:#fbfcfe;padding:12px 14px}
.sim .sh{display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:6px}
.sim .sh .chip{background:#fff3d6;color:#8a5a00}
.sim .obs{margin:0 0 8px;font-size:15px;color:var(--text2)}
.sim svg{width:100%;max-width:760px;margin:0 auto;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none}
.sim .ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:8px 0}
.sim .ctl label{display:flex;gap:6px;align-items:center;font-size:14.5px;font-weight:600}
.sim .ctl input[type=range]{width:150px}
.sim .out{font-size:15px;background:#fff;border:1px dashed #b9c7d8;border-radius:10px;padding:6px 12px;margin-top:6px;line-height:1.7}
.sim .seg button{font:inherit;font-size:14px;font-weight:700;padding:4px 12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;border-radius:8px}
.sim .seg button.on{background:var(--c3);border-color:var(--c3);color:#fff}
/* 地圖 */
.map-sec{margin:12px 0}
.mp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mp a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--text);padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.mp a:hover{border-color:var(--c3)}
.mp a.done{background:var(--goods);border-color:#9fd5b3}
.mp a.sugg{background:var(--warns);border-color:#e6b95c}
.mp .id{font-weight:800;color:var(--c3);min-width:32px}
.mp .c4 .id{color:var(--c4)}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}
  .top-in{padding:6px 10px}.brand small{display:none}.nav{margin-left:0;width:100%;justify-content:space-between}
  .nav a{flex:1;text-align:center;padding:6px 8px}
  main{padding:12px 10px 60px}.card{padding:14px}.q-stem{font-size:17px}
  .sim .ctl input[type=range]{width:120px}
}

<script>
/* ---- a_base.js ---- */
'use strict';
/* ===== 國中自然 2上 第3、4章 段考複習：基礎工具、題型建構、任務／複習卡登錄 ===== */
const EXAM = 'e2';                 // 第二次段考（回傳時用來分開兩次段考的紀錄）
const PASS = 3;                    // 連續答對幾題才算通過
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbze_RHP4FSaRdN54hviuC_IamEAJ2X6_7oAd322CKOEuLhbBvGGjWimZxbGmlrSAbVm-Q/exec';
const FILE_MODE = location.protocol === 'file:';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const round = (x, d = 0) => Math.round(x * 10 ** d) / 10 ** d;
const near = (x, y, rel = 1e-6, abs = 1e-9) => Math.abs(x - y) <= Math.max(Math.abs(y) * rel, abs);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const strip = s => String(s).replace(/<[^>]+>/g, '');
const store = {
  get(k, d) { try { const v = localStorage.getItem('nat2e2:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nat2e2:' + k, JSON.stringify(v)); } catch (e) { } },
};
function parseNum(s) {                    // 支援 2.5e6、2.5×10^6、千分位逗號
  s = String(s).trim().replace(/,/g, '').replace(/[−–]/g, '-').replace(/\s+/g, '');
  const m = s.match(/^(-?[\d.]+)[×xX*]10\^?(-?\d+)$/);
  if (m) return Number(m[1]) * 10 ** Number(m[2]);
  return s === '' ? NaN : Number(s);
}
const fmt = x => {                        // 數字顯示：很大或很小用科學記號
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -3 && e <= 5) return String(round(x, 6));
  return `${round(x / 10 ** e, 4)}×10<sup>${e}</sup>`;
};

/* ---------- 題型：選擇／兩階層（答案＋理由）／數值 ---------- */
const MC = (stem, opts, a, exp, extra = {}) => ({ type: 'mc', stem, opts, a, exp, ...extra });
const TT = (stem, opts, a, ropts, ra, exp, extra = {}) => ({ type: 'tt', stem, opts, a, ropts, ra, exp, ...extra });
const NUM = (stem, ans, unit, exp, extra = {}) => ({ type: 'num', stem, ans, unit, exp, ...extra });

/* 題庫：每筆 {t:錯誤類型, q, o:[選項], a:正解索引, r:[理由], ra, e:解釋, tf:true/false(是非題), svg} */
const _last = {};
function bank(id, arr) {
  return () => {
    let b, n = 0;
    do { b = pick(arr); } while (arr.length > 1 && _last[id] === b.q && ++n < 30);
    _last[id] = b.q;
    const extra = { tag: b.t || id, svg: typeof b.svg === 'function' ? b.svg() : b.svg };
    if (b.tf !== undefined) return MC(b.q, ['正確', '錯誤'], b.tf ? 0 : 1, b.e, { ...extra, fixed: true });
    return b.r ? TT(b.q, b.o, b.a, b.r, b.ra, b.e, extra) : MC(b.q, b.o, b.a, b.e, extra);
  };
}
/* 題庫＋出題器混合：約 45% 用出題器（隨機生成），其餘抽題庫 */
const mixGen = (id, bk, gens) => { const g0 = bank(id, bk); return () => Math.random() < .45 ? pick(gens)() : g0(); };
/* 讓出題器自動補上 tag（錯誤類型） */
const tagged = (tag, q) => { q.tag = q.tag || tag; return q; };

/* ---------- 章節、任務、複習卡登錄 ---------- */
const SECS = [
  { id: '3-1', ch: 3, name: '3-1 波的傳播與特徵' }, { id: '3-2', ch: 3, name: '3-2 聲音的形成' },
  { id: '3-3', ch: 3, name: '3-3 多變的聲音' }, { id: '3-4', ch: 3, name: '3-4 聲波的傳播與應用' },
  { id: '4-1', ch: 4, name: '4-1 光的傳播' }, { id: '4-2', ch: 4, name: '4-2 光的反射與面鏡成像' },
  { id: '4-3', ch: 4, name: '4-3 光的折射' }, { id: '4-4', ch: 4, name: '4-4 透鏡成像' }, { id: '4-5', ch: 4, name: '4-5 色散與顏色' },
];
const TASKS = [], TASK = {}, CARDS = {};
function def(id, o) { const t = { id, ch: +o.sec[0], ...o }; TASKS.push(t); TASK[id] = t; }
function card(id, o) { CARDS[id] = o; }
const SIMS = {};           // 互動模擬：SIMS[名稱] = (host) => {...}

/* ---------- 複習卡的版面小工具 ---------- */
const kp = (t, h, c4) => `<div class="kp ${c4 ? 'c4' : ''}"><b class="t">${t}</b>${h}</div>`;
const tbl = (head, rows) => `<div class="tbl-scroll"><table class="t"><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ---- b_svg.js ---- */
/* ===== SVG 圖形工具（題目附圖與複習卡用） ===== */
const COL = { k: '#222', r: '#d32f2f', b: '#1565c0', o: '#e07b00', g: '#2e7d32', p: '#7b1fa2', gr: '#8a97a6' };
const arrowDefs = () => ['k', 'r', 'b', 'o', 'g', 'p'].map(c => `<marker id="ah-${c}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${COL[c]}"/></marker>`).join('');
const SVG = (w, h, inner, style = '') => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" style="max-width:${w}px;${style}"><defs>${arrowDefs()}</defs>${inner}</svg>`;
const line = (x1, y1, x2, y2, c = 'k', w = 2, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[c] || c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = 'k', w = 2.5, extra = '') => line(x1, y1, x2, y2, c, w, `marker-end="url(#ah-${c})" ${extra}`);
const text = (x, y, s, c = 'k', size = 14, anchor = 'middle', extra = '') => `<text x="${x}" y="${y}" fill="${COL[c] || c}" font-size="${size}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const d2r = d => d * Math.PI / 180;

/* ---- 週期波（橫波）：公分格線，用來讀波長、振幅 ---- */
function waveSvg({ lam, amp, n = 2, mark = false }) {
  const px = Math.min(34, Math.floor(430 / (lam * n))), ypx = 24;
  const W = lam * n * px + 70, H = (2 * amp + 2) * ypx + 44, x0 = 38, y0 = H / 2 - 8;
  let s = '';
  for (let i = 0; i <= lam * n; i++) {
    s += line(x0 + i * px, 8, x0 + i * px, H - 34, '#e3e8ee', 1);
    if (px >= 20 || i % 2 === 0) s += text(x0 + i * px, H - 18, i, 'gr', 12);
  }
  for (let j = -amp - 1; j <= amp + 1; j++) {
    s += line(x0, y0 - j * ypx, x0 + lam * n * px, y0 - j * ypx, '#e3e8ee', 1);
    if (j !== 0 && j % 1 === 0 && j >= -amp && j <= amp) s += text(x0 - 6, y0 - j * ypx + 4, Math.abs(j), 'gr', 12, 'end');
  }
  s += line(x0, y0, x0 + lam * n * px + 8, y0, 'k', 1.6) + text(x0 + lam * n * px + 12, H - 18, '公分', 'gr', 12, 'start');
  let d = '';
  for (let i = 0; i <= 160 * n; i++) { const x = i / 160 * lam; d += (i ? 'L' : 'M') + (x0 + x * px).toFixed(1) + ',' + (y0 - amp * ypx * Math.sin(2 * Math.PI * x / lam)).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${COL.b}" stroke-width="3"/>`;
  s += text(8, y0 - 2, '0', 'gr', 12, 'start') + text(x0 + 4, 14, '↑ 高度（公分）', 'gr', 12, 'start');
  return SVG(W, H, s);
}

/* ---- 波形比較（響度、音調、音色）：items=[{label,type,amp,cyc}] ---- */
function wf(type, ph) {            // ph 為週期數
  const t = ph - Math.floor(ph);
  if (type === 'sine') return Math.sin(2 * Math.PI * ph);
  if (type === 'tri') return t < .25 ? 4 * t : t < .75 ? 2 - 4 * t : 4 * t - 4;
  if (type === 'sq') { const v = Math.sin(2 * Math.PI * ph); return Math.max(-1, Math.min(1, v * 3.2)); }
  if (type === 'saw') return 2 * t - 1;
  if (type === 'noise') return (Math.sin(2 * Math.PI * ph * 1.0) * .5 + Math.sin(2 * Math.PI * ph * 2.73 + 1) * .35 + Math.sin(2 * Math.PI * ph * 5.17 + 2) * .45 + Math.sin(2 * Math.PI * ph * 8.9) * .3) / 1.1;
  return 0;
}

    const where = ['物在 2 倍焦距外', '物在 2 倍焦距上', '物在 1 倍到 2 倍焦距之間', '物在焦點上', '物在焦點內（比焦距近）'][ans];

    else if (P === '黑') { ans = '黑色'; ra = 2; }
    else if (L === '白') { ans = P + '色'; ra = 0; }
    else if (L === P) { ans = P + '色'; ra = 0; }
    else { ans = '黑色'; ra = 0; }
    const pool = ['紅色', '綠色', '藍色', '白色', '黑色'];
    const opts = shuffle([ans, ...shuffle(pool.filter(x => x !== ans)).slice(0, 3)]);

    { t: '不透明物體的顏色', q: '日本國旗是白底紅圓。在「紅光」照射下，看起來會怎樣？', o: ['整面都是紅色，看不出紅圓的形狀', '白底變成黑色，紅圓是紅色', '紅圓變成黑色，白底是紅色', '整面都是黑色'], a: 0, e: '白底反射各種色光，所以在紅光下呈現紅色；紅圓也反射紅光，也是紅色，所以圖案看不出來。' },

    if (k === 2) { const f = pick([2, 4, 5, 10, 20, 0.5]); const T = round(1 / f, 6);
      return NUM(`某個波的頻率是 ${f} 赫，它的週期是多少秒？`, T, '秒', `T ＝ 1 ÷ f ＝ 1 ÷ ${f} ＝ ${T} 秒。`, { tag: '週期頻率互為倒數' }); }
    return pick([

/* W7 波速 */
(() => {
  const g = () => {
    const k = rnd(0, 4);
    if (k === 0) { const f = pick([2, 5, 10, 20, 50]), lam = pick([3, 4, 5, 6, 8, 10, 12]); const v = f * lam;
      return NUM(`一個週期波的頻率是 ${f} 赫，波長是 ${lam} 公分，波速是多少公分／秒？`, v, '公分／秒', `v ＝ f × λ ＝ ${f} × ${lam} ＝ ${v} 公分／秒。`, { tag: '波速公式 v＝f×λ' }); }
    if (k === 1) { const f = pick([2, 4, 5, 10]), lam = pick([3, 5, 6, 12, 15]); const v = f * lam;
      return NUM(`同一條繩子上，週期波的波速是 ${v} 公分／秒，頻率是 ${f} 赫，波長是多少公分？`, lam, '公分', `λ ＝ v ÷ f ＝ ${v} ÷ ${f} ＝ ${lam} 公分。`, { tag: '波速公式 v＝f×λ' }); }
    if (k === 2) { const t = pick([2, 3, 4, 5]), v = pick([10, 20, 25, 30, 40]); const L = v * t;
      return NUM(`繩子上有一個單獨的波，花了 ${t} 秒從一端傳到 ${L} 公分遠的另一端，這個波的波速是多少公分／秒？`, v, '公分／秒', `單一個波的波速 ＝ 傳遞距離 ÷ 傳遞時間 ＝ ${L} ÷ ${t} ＝ ${v} 公分／秒。（單一個波不是週期波，不用 f×λ。）`, { tag: '單一波的波速 v＝L/t' }); }
    if (k === 3) { const f = pick([1, 2, 4]), cnt = pick([2, 4, 6]), lam = pick([10, 15, 20, 30]); const t = cnt / f, n = cnt + 1, v = f * lam;
      return NUM(`湖面有規律的水波，量得連續 ${n} 個波峰通過浮標的時間是 ${t} 秒，相鄰兩波峰的距離是 ${lam} 公分，水波的波速是多少公分／秒？`, v, '公分／秒', `連續 ${n} 個波峰之間隔了 ${cnt} 個全波，花 ${t} 秒，頻率 ＝ ${cnt} ÷ ${t} ＝ ${f} 赫；波長 ${lam} 公分，所以 v ＝ f×λ ＝ ${f} × ${lam} ＝ ${v} 公分／秒。`, { tag: '波速與連續波峰', hint: '先想想：連續 n 個波峰之間有幾個全波？' }); }
    const T = pick([0.5, 0.25, 2]), lam = pick([20, 40, 60]); const v = lam / T;
    return NUM(`一個週期波的週期是 ${T} 秒，波長是 ${lam} 公分，波速是多少公分／秒？`, v, '公分／秒', `一個週期波前進一個波長，用了一個週期的時間：v ＝ λ ÷ T ＝ ${lam} ÷ ${T} ＝ ${v} 公分／秒。`, { tag: '波速與週期' });
  };
  def('W7', { sec: '3-1', can: '用 v＝f×λ（或 v＝距離÷時間）計算波速', lc: 'Ka-IV-1', gen: g });
})();

/* W8 同介質中波速固定 */
(() => {

  const g = () => {

    if (r < .5) {
      const lam1 = pick([12, 24, 30, 60]), f1 = pick([1, 2, 5]), k = pick([2, 3, 0.5]); const v = f1 * lam1, f2 = f1 * k, lam2 = lam1 / k;
      return NUM(`同一條繩子上，原本頻率 ${f1} 赫、波長 ${lam1} 公分。把頻率改成 ${f2} 赫（繩子沒有變），新的波長是多少公分？`, lam2, '公分', `同一條繩子（同一種介質）波速不變：v ＝ ${f1} × ${lam1} ＝ ${v} 公分／秒。新波長 ＝ ${v} ÷ ${f2} ＝ ${lam2} 公分。`, { tag: '同介質波速固定', hint: '波速不會因為你擺動得比較快或比較慢而改變。' });

      return TT(b.q, b.o, b.a, RS, 0, b.e, { tag: '同介質波速固定' });

  };
  def('W8', { sec: '3-1', can: '說明同一介質中波速固定，頻率與波長互相消長', lc: 'Ka-IV-1', gen: g });
})();

/* ===== 第 3 章 複習卡 W1–W8、S1–S11（全部用自己的話撰寫；圖為自繪 SVG） ===== */
const waveAnnot = () => {
  const x0 = 30, lam = 170, A = 52, y0 = 100; let d = '';
  for (let i = 0; i <= 340; i++) { const x = i / 340 * 2 * lam; d += (i ? 'L' : 'M') + (x0 + x).toFixed(1) + ',' + (y0 - A * Math.sin(2 * Math.PI * x / lam)).toFixed(1); }
  let s = line(x0, y0, x0 + 2 * lam + 10, y0, 'gr', 1.4, 'stroke-dasharray="5 4"') + text(x0 + 2 * lam + 14, y0 + 4, '平衡位置', 'gr', 12, 'start');
  s += `<path d="${d}" fill="none" stroke="${COL.b}" stroke-width="3"/>`;
  const p1 = x0 + lam / 4, p2 = x0 + 5 * lam / 4, t1 = x0 + 3 * lam / 4;
  s += `<circle cx="${p1}" cy="${y0 - A}" r="4.5" fill="${COL.r}"/><circle cx="${p2}" cy="${y0 - A}" r="4.5" fill="${COL.r}"/><circle cx="${t1}" cy="${y0 + A}" r="4.5" fill="${COL.g}"/>`;
  s += text(p1, y0 - A - 10, '波峰', 'r', 14) + text(p2, y0 - A - 10, '波峰', 'r', 14) + text(t1, y0 + A + 20, '波谷', 'g', 14);
  s += arrow(p1 + 6, y0 - A - 28, p2 - 6, y0 - A - 28, 'p', 2.2) + arrow(p2 - 6, y0 - A - 28, p1 + 6, y0 - A - 28, 'p', 2.2) + text((p1 + p2) / 2, y0 - A - 34, '波長（一個全波的長度）', 'p', 13);
  s += arrow(p1 + 26, y0 - 2, p1 + 26, y0 - A + 4, 'o', 2.4) + text(p1 + 70, y0 - A / 2 + 4, '振幅', 'o', 14, 'start');
  return SVG(430, 200, s);
};

const loop = (host, fn) => { const t0 = performance.now(); const tick = t => { if (!host.isConnected) return; fn((t - t0) / 1000); requestAnimationFrame(tick); }; requestAnimationFrame(tick); };
function dragOn(svg, onMove) {
  const pt = e => { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return { x: (e.clientX - r.left) / r.width * vb.width, y: (e.clientY - r.top) / r.height * vb.height }; };
  let on = false;
  svg.addEventListener('pointerdown', e => { on = true; try { svg.setPointerCapture(e.pointerId); } catch (x) { } onMove(pt(e)); });
  svg.addEventListener('pointermove', e => { if (on) onMove(pt(e)); });
  svg.addEventListener('pointerup', () => { on = false; });
  svg.addEventListener('pointercancel', () => { on = false; });
}
let AC = null;

    (mode === 'noise' ? `<span class="seg" data-k="seg"><button data-n="0" class="on">樂音（有規律）</button><button data-n="1">噪音（沒有規律）</button></span>` : '');
  simBox(host, '聲音三要素實驗室', obs, `<div class="ctl">${ctl}<button class="btn" data-k="snd">🔊 播放聲音</button></div>${svgOpen(480, 150)}<div class="out" data-k="out"></div>`);

    if (gain) gain.gain.value = snd ? S.amp * .16 : 0; if (osc) { osc.frequency.value = 55 * S.cyc; osc.type = { sine: 'sine', tri: 'triangle', sq: 'square', saw: 'sawtooth' }[S.shape]; }
  };

    s += text(from.x + (S.rev ? 14 : -14), from.y - 14, '入射線', cin, 13, S.rev ? 'start' : 'end') + text(to.x + (S.rev ? -14 : 14), to.y - 14, '反射線', cout, 13, S.rev ? 'end' : 'start');
    const r = 55; s += `<path d="M${O.x},${O.y - r} A${r},${r} 0 0 0 ${O.x - r * sn},${O.y - r * cs}" fill="none" stroke="${COL.o}" stroke-width="2.5"/><path d="M${O.x},${O.y - r - 9} A${r + 9},${r + 9} 0 0 1 ${O.x + (r + 9) * sn},${O.y - (r + 9) * cs}" fill="none" stroke="${COL.r}" stroke-width="2.5"/>`;
    setG(host, s);

  draw();
};
function reflectImage(host) {

    s += arrow(xo + 8, Ty, Mx - 2, yp, 'r', 2) + arrow(Mx - 2, yp, E.x + 16, E.y, 'r', 2) + line(Mx, yp, xi - 8, Ty, 'r', 1.6, 'stroke-dasharray="5 4"');
    s += `<circle cx="${E.x}" cy="${E.y}" r="11" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="${E.x + 3}" cy="${E.y}" r="4.5" fill="#333"/>` + text(E.x, E.y + 28, '眼睛', 'k', 12);

  };
  Q(host, 'd').oninput = draw; draw();
}

/* --- 凸面鏡與凹面鏡 --- */
SIMS.simCurved = host => {
  const S = { kind: 'concave', f: 80, src: false };
  simBox(host, '凸面鏡與凹面鏡', '平行光照射後，反射光線是「會聚」還是「發散」？再試試把光源放在凹面鏡的焦點上。',
    `<div class="ctl"><span class="seg"><button data-c="concave" class="on">凹面鏡</button><button data-c="convex">凸面鏡</button></span>${rng(host, '焦距', 'f', 60, 120, 10, 80)}<label><input type="checkbox" data-k="src"> 光源放在焦點（只有凹面鏡）</label></div>${svgOpen(540, 300)}<div class="out" data-k="out"></div>`);
  const V = 380, cy = 150, ys = [-90, -60, -30, 30, 60, 90];
  const draw = () => {
    const f = S.f, cc = S.kind === 'concave', src = cc && S.src;
    const sx = y => cc ? V - y * y / (4 * f) : V + y * y / (4 * f);
    let s = line(20, cy, 520, cy, 'gr', 1, 'stroke-dasharray="5 4"');
    let d = ''; for (let y = -105; y <= 105; y += 5) d += (d ? 'L' : 'M') + sx(y).toFixed(1) + ',' + (cy + y);
    s += `<path d="${d}" fill="none" stroke="#1565c0" stroke-width="5"/>`;
    const Fx = cc ? V - f : V + f; s += `<circle cx="${Fx}" cy="${cy}" r="5" fill="${COL.k}"/>` + text(Fx, cy + 20, cc ? '焦點 F' : '焦點 F（在鏡後）', 'k', 13);
    ys.forEach(y => {
      const hx = sx(y), hy = cy + y;
      if (src) { s += arrow(Fx, cy, hx - 4, hy, 'o', 1.8) + arrow(hx, hy, 24, hy, 'r', 2); return; }
      s += arrow(24, hy, hx - 3, hy, 'o', 2);
      if (cc) { const dx = Fx - hx, dy = cy - hy, L = Math.hypot(dx, dy); s += arrow(hx, hy, Fx, cy, 'r', 2) + line(Fx, cy, Fx + dx / L * 70, cy + dy / L * 70, 'r', 1.6); }
      else { const dx = hx - Fx, dy = hy - cy, L = Math.hypot(dx, dy); s += arrow(hx, hy, hx - dx / L * 190, hy - dy / L * 190, 'r', 2) + line(hx, hy, Fx, cy, 'r', 1.4, 'stroke-dasharray="5 4"'); }
    });
    s += text(100, 22, src ? '光源在焦點 → 反射後變成平行光' : '平行光射向' + (cc ? '凹' : '凸') + '面鏡', 'k', 14);
    setG(host, s);
    Q(host, 'out').innerHTML = src ? '光源放在凹面鏡焦點，反射光變成<b>平行光束</b>，所以手電筒能照得很遠（利用光的可逆性）。' : cc ? '凹面鏡：平行光反射後<b>會聚於焦點</b>。物體靠近時成正立放大的虛像（化妝鏡）。' : '凸面鏡：平行光反射後<b>發散</b>，往後延伸（虛線）交於鏡後焦點。成正立縮小的虛像，視野大（後照鏡）。';
  };
  $$('[data-c]', host).forEach(b => b.onclick = () => { S.kind = b.dataset.c; $$('[data-c]', host).forEach(x => x.classList.toggle('on', x === b)); Q(host, 'src').disabled = S.kind === 'convex'; draw(); });
  Q(host, 'f').oninput = () => { S.f = +Q(host, 'f').value; Q(host, 'fv').textContent = S.f; draw(); };
  Q(host, 'src').onchange = () => { S.src = Q(host, 'src').checked; draw(); };
  draw();

/* --- 折射：角度、水與玻璃比較、視深 --- */
const NMED = { water: { n: 1.33, name: '水', c: '#cfe7fb' }, glass: { n: 1.5, name: '玻璃', c: '#d7e8d3' } };
SIMS.simRefract = host => {
  const mode = host.dataset.mode || 'angle';
  if (mode === 'compare') return refractCompare(host);
  if (mode === 'depth') return refractDepth(host);
  const S = { med: 'water', dir: 'in', th: 50 };
  simBox(host, '光的折射', '改變入射角和介質，看折射角比入射角大還是小。灰色虛線是「如果不偏折」會走的路。',
    `<div class="ctl"><span class="seg" data-k="sm"><button data-m="water" class="on">水</button><button data-m="glass">玻璃</button></span><span class="seg" data-k="sd"><button data-d="in" class="on">空氣 → 介質</button><button data-d="out">介質 → 空氣</button></span>${rng(host, '入射角', 'th', 0, 75, 1, 50, '°')}</div>${svgOpen(480, 300)}<div class="out" data-k="out"></div>`);
  const O = { x: 240, y: 150 }, R = 125;
  const draw = () => {
    const M = NMED[S.med], inn = S.dir === 'in', maxT = inn ? 75 : 40; if (S.th > maxT) S.th = maxT; Q(host, 'th').max = maxT; Q(host, 'th').value = S.th; Q(host, 'thv').textContent = S.th + '°';
    const n1 = inn ? 1 : M.n, n2 = inn ? M.n : 1, t1 = S.th, t2 = Math.asin(Math.min(1, n1 * Math.sin(d2r(t1)) / n2)) * 180 / Math.PI;
    const a = Math.sin(d2r(t1)), b = Math.cos(d2r(t1)), a2 = Math.sin(d2r(t2)), b2 = Math.cos(d2r(t2));
    let s = `<rect x="10" y="10" width="460" height="140" fill="#f4f9ff"/><rect x="10" y="150" width="460" height="140" fill="${M.c}"/>` + line(10, 150, 470, 150, 'k', 2) + line(O.x, 18, O.x, 284, 'k', 1.4, 'stroke-dasharray="6 5"') + text(O.x + 6, 30, '法線', 'k', 13, 'start');
    s += text(24, 32, '空氣（光速快）', 'k', 14, 'start', 'font-weight="700"') + text(24, 282, M.name + (S.med === 'water' ? '（光速慢）' : '（光速更慢）'), 'k', 14, 'start', 'font-weight="700"');
    let ix, iy, rx, ry;
    if (inn) { ix = O.x - R * a; iy = O.y - R * b; rx = O.x + R * a2; ry = O.y + R * b2; s += line(O.x, O.y, O.x + R * a, O.y + R * b, '#8a97a6', 1.8, 'stroke-dasharray="6 5"'); }
    else { ix = O.x - R * a; iy = O.y + R * b; rx = O.x + R * a2; ry = O.y - R * b2; s += line(O.x, O.y, O.x + R * a, O.y - R * b, '#8a97a6', 1.8, 'stroke-dasharray="6 5"'); }
    s += arrow(ix, iy, O.x + (ix - O.x) * .02, O.y + (iy - O.y) * .02, 'o', 3) + arrow(O.x, O.y, rx, ry, 'r', 3);
    s += `<circle cx="${ix}" cy="${iy}" r="10" fill="#ffd54f" stroke="#e0a800" stroke-width="2"/>`;
    s += text(ix - 10, iy + (inn ? -12 : 20), '入射線', 'o', 13, 'end') + text(rx + 10, ry + (inn ? 20 : -12), '折射線', 'r', 13, 'start');
    s += text(O.x - 60, O.y + (inn ? -34 : 52), '入射角 ' + t1 + '°', 'o', 14, 'middle', 'font-weight="700"') + text(O.x + 62, O.y + (inn ? 52 : -34), '折射角 ' + Math.round(t2) + '°', 'r', 14, 'middle', 'font-weight="700"');
    setG(host, s);
    Q(host, 'out').innerHTML = t1 === 0 ? '垂直入射：<b>不偏折</b>，但光速仍然改變。' : `入射角 <b>${t1}°</b>，折射角 <b>${Math.round(t2)}°</b>：折射角${t2 < t1 ? '<b>比入射角小</b>（光速由快變慢 → <b>偏向法線</b>）' : '<b>比入射角大</b>（光速由慢變快 → <b>偏離法線</b>）'}。`;
  };
  $$('[data-m]', host).forEach(x => x.onclick = () => { S.med = x.dataset.m; $$('[data-m]', host).forEach(y => y.classList.toggle('on', y === x)); draw(); });
  $$('[data-d]', host).forEach(x => x.onclick = () => { S.dir = x.dataset.d; $$('[data-d]', host).forEach(y => y.classList.toggle('on', y === x)); draw(); });
  Q(host, 'th').oninput = () => { S.th = +Q(host, 'th').value; draw(); };
  draw();
};
function refractCompare(host) {
  const S = { th: 50, rev: false };
  simBox(host, '水與玻璃誰偏折得多？', '入射角一樣，光從空氣進入水和玻璃，哪一個折射角比較小？勾選「走回頭路」看光路是否可逆。',
    `<div class="ctl">${rng(host, '入射角', 'th', 15, 75, 1, 50, '°')}<label><input type="checkbox" data-k="rv"> 走回頭路（反向）</label></div>${svgOpen(560, 280)}<div class="out" data-k="out"></div>`);
  const draw = () => {
    S.th = +Q(host, 'th').value; Q(host, 'thv').textContent = S.th + '°'; S.rev = Q(host, 'rv').checked;
    const R = 105, cy = 135; let s = '', out = [];
    [['water', 140], ['glass', 420]].forEach(([k, cx]) => {
      const M = NMED[k], t2 = Math.asin(Math.sin(d2r(S.th)) / M.n) * 180 / Math.PI; out.push(Math.round(t2));
      const a = Math.sin(d2r(S.th)), b = Math.cos(d2r(S.th)), a2 = Math.sin(d2r(t2)), b2 = Math.cos(d2r(t2));
      s += `<rect x="${cx - 130}" y="10" width="260" height="${cy - 10}" fill="#f4f9ff"/><rect x="${cx - 130}" y="${cy}" width="260" height="${260 - cy}" fill="${M.c}"/>` + line(cx - 130, cy, cx + 130, cy, 'k', 2) + line(cx, 14, cx, 268, 'k', 1.3, 'stroke-dasharray="6 5"');
      s += text(cx - 124, 30, '空氣', 'k', 13, 'start', 'font-weight="700"') + text(cx - 124, 256, M.name, 'k', 13, 'start', 'font-weight="700"');
      const P1 = { x: cx - R * a, y: cy - R * b }, P2 = { x: cx + R * a2, y: cy + R * b2 };
      const f = S.rev ? [P2, P1, 'r', 'o'] : [P1, P2, 'o', 'r'];
      s += arrow(f[0].x, f[0].y, cx + (f[0].x - cx) * .02, cy + (f[0].y - cy) * .02, f[2], 3) + arrow(cx, cy, f[1].x, f[1].y, f[3], 3);
      s += text(cx, 276 - 2, `折射角 ${Math.round(t2)}°`, 'r', 14, 'middle', 'font-weight="700"');
    });
    setG(host, s);
    Q(host, 'out').innerHTML = `入射角都是 ${S.th}°：水中折射角 <b>${out[0]}°</b>，玻璃中折射角 <b>${out[1]}°</b>。玻璃的折射角<b>較小</b>，表示光在玻璃中速率比水更慢、偏折更多。${S.rev ? '<br>光反過來走：路徑完全相同（光的可逆性）。' : ''}`;
  };
  $$('input', host).forEach(i => i.addEventListener('input', draw)); draw();
}
function refractDepth(host) {
  simBox(host, '視深：看起來比較淺', '調整魚的實際深度和你的觀察位置。灰色的魚是「眼睛以為魚在的位置」，它和真正的魚比，哪個比較深？',
    `<div class="ctl">${rng(host, '魚的實際深度（公尺）', 'D', 1, 4, .5, 2)}${rng(host, '眼睛離魚的水平距離（公尺）', 'X', 2, 6, .5, 3.5)}</div>${svgOpen(540, 320)}<div class="out" data-k="out"></div>`);
  const draw = () => {
    const D = +Q(host, 'D').value, X = +Q(host, 'X').value; Q(host, 'Dv').textContent = D; Q(host, 'Xv').textContent = X;
    const sc = 42, surf = 120, fx = 110, he = 1.6, nw = 1.33;
    let lo = 0, hi = X;
    const fn = x => nw * x / Math.hypot(x, D) - (X - x) / Math.hypot(X - x, he);
    for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (fn(m) > 0) hi = m; else lo = m; }
    const xp = (lo + hi) / 2, app = he * xp / (X - xp);
    const Ex = fx + X * sc, Ey = surf - he * sc, Px = fx + xp * sc, Fy = surf + D * sc, Ay = surf + app * sc;
    let s = `<rect x="10" y="${surf}" width="520" height="${310 - surf}" fill="#cfe7fb"/>` + line(10, surf, 530, surf, 'k', 2) + text(20, surf - 8, '空氣', 'k', 13, 'start') + text(20, surf + 20, '水', 'k', 13, 'start');
    s += `<ellipse cx="${fx}" cy="${Fy}" rx="17" ry="9" fill="#ef6c00"/><polygon points="${fx + 14},${Fy} ${fx + 28},${Fy - 8} ${fx + 28},${Fy + 8}" fill="#ef6c00"/><circle cx="${fx - 8}" cy="${Fy - 2}" r="2" fill="#fff"/>`;
    s += `<ellipse cx="${fx}" cy="${Ay}" rx="17" ry="9" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="4 3"/>` + text(fx + 40, Ay + 4, '看起來的位置（虛）', 'gr', 12, 'start');
    s += arrow(fx + 12, Fy - 4, Px - 1, surf + 1, 'r', 2.2) + arrow(Px, surf, Ex - 12, Ey + 10, 'r', 2.2) + line(Px, surf, fx + 6, Ay - 4, 'r', 1.5, 'stroke-dasharray="5 4"');
    s += `<circle cx="${Ex}" cy="${Ey}" r="11" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="${Ex - 3}" cy="${Ey + 1}" r="4.5" fill="#333"/>` + text(Ex, Ey - 18, '眼睛', 'k', 12);
    s += arrow(44, surf + 4, 44, Fy - 6, 'g', 2) + text(40, (surf + Fy) / 2 + 4, '實深', 'g', 13, 'end') + arrow(72, surf + 4, 72, Ay - 6, 'p', 2) + text(76, surf + 22, '視深', 'p', 13, 'start');
    setG(host, s);
    Q(host, 'out').innerHTML = `實際深度（實深）＝ <b>${D}</b> 公尺，看起來的深度（視深）約 <b>${round(app, 2)}</b> 公尺 → <b>視深 ＜ 實深</b>。<br>光從水進入空氣時<b>偏離法線</b>，眼睛沿進來的光線往回看，就以為魚在比較淺的地方。`;
  };
  $$('input', host).forEach(i => i.addEventListener('input', draw)); draw();
}

/* --- 透鏡成像（凸透鏡／凹透鏡） --- */
SIMS.simLens = host => {
  const mode = host.dataset.mode || 'convex', kind0 = mode === 'concave' ? 'concave' : 'convex';
  const S = { kind: kind0, u: mode === 'concave' ? 1.5 : 2.5, r1: true, r2: true, r3: true };
  simBox(host, mode === 'concave' ? '凹透鏡成像' : '透鏡成像與三條特殊光線', mode === 'rays' ? '拖曳蠟燭（或用滑桿），看三條特殊光線怎麼走、交在哪裡就是像的位置。' : '拖曳蠟燭改變物距。看像在哪一側、倒立還是正立、放大還是縮小。（F ＝ 焦點，2F ＝ 2 倍焦距）',
    `<div class="ctl">${mode === 'concave' ? '' : '<span class="seg"><button data-l="convex" class="on">凸透鏡</button><button data-l="concave">凹透鏡</button></span>'}${rng(host, '物距 u（單位：f）', 'u', .3, 3.4, .05, S.u)}<label><input type="checkbox" data-k="r1" checked> ①平行光</label><label><input type="checkbox" data-k="r2" checked> ②過鏡心</label><label><input type="checkbox" data-k="r3" checked> ③過焦點</label></div>${svgOpen(580, 310)}<div class="out" data-k="out"></div>`);
  const cy = 160, xl = 300, f = 80, h = 48;
  const draw = () => {
    const cv = S.kind === 'convex', u = S.u * f, xo = xl - u, T = { x: xo, y: cy - h };
    S.r1 = Q(host, 'r1').checked; S.r2 = Q(host, 'r2').checked; S.r3 = Q(host, 'r3').checked;
    Q(host, 'u').value = S.u; Q(host, 'uv').textContent = S.u;
    let s = line(10, cy, 570, cy, 'gr', 1.2);
    s += cv ? `<path d="M${xl},${cy - 105} Q${xl + 17},${cy} ${xl},${cy + 105} Q${xl - 17},${cy} ${xl},${cy - 105}Z" fill="#cfe7fb" stroke="#1565c0" stroke-width="2.4"/>` : `<path d="M${xl - 13},${cy - 105} Q${xl - 2},${cy} ${xl - 13},${cy + 105} L${xl + 13},${cy + 105} Q${xl + 2},${cy} ${xl + 13},${cy - 105}Z" fill="#cfe7fb" stroke="#1565c0" stroke-width="2.4"/>`;
    [[xl - f, 'F'], [xl + f, 'F'], [xl - 2 * f, '2F'], [xl + 2 * f, '2F']].forEach(([x, t]) => s += `<circle cx="${x}" cy="${cy}" r="4" fill="${COL.k}"/>` + text(x, cy + 20, t, 'k', 12));
    s += arrow(xo, cy, xo, cy - h + 3, 'o', 5);
    let none = cv && Math.abs(S.u - 1) < .03, v = 0, m = 0, tip = null;
    if (!none) { v = cv ? u * f / (u - f) : -u * f / (u + f); m = -v / u; tip = { x: xl + v, y: cy - m * h }; }
    const real = cv && v > 0, ext = 190;
    const outRay = (P, color) => {                       // 通過透鏡點 P 之後的光線（朝像或遠離像）
      if (none) { return arrow(P.x, P.y, P.x + ext, P.y + (P.y > cy ? 0 : 0), 'r', 2); }
      const dx = real ? tip.x - P.x : P.x - tip.x, dy = real ? tip.y - P.y : P.y - tip.y, L = Math.hypot(dx, dy) || 1;
      const len = real ? L : ext;
      let r = arrow(P.x, P.y, P.x + dx / L * len, P.y + dy / L * len, 'r', 2.2);
      if (!real) r += line(P.x, P.y, tip.x, tip.y, 'r', 1.5, 'stroke-dasharray="5 4"');
      return r;
    };
    if (S.r1) { const P = { x: xl, y: T.y }; s += arrow(T.x, T.y, P.x, P.y, 'o', 2) + (none && cv ? arrow(P.x, P.y, xl + f, cy, 'r', 2.2) : outRay(P)); }
    if (S.r2) { const P = { x: xl, y: cy }; s += arrow(T.x, T.y, P.x, P.y, 'o', 2); const dx = xl - T.x, dy = cy - T.y, L = Math.hypot(dx, dy); if (real) s += arrow(P.x, P.y, tip.x, tip.y, 'r', 2.2); else { s += arrow(P.x, P.y, P.x + dx / L * ext, P.y + dy / L * ext, 'r', 2.2); if (tip) s += line(P.x, P.y, tip.x, tip.y, 'r', 1.5, 'stroke-dasharray="5 4"'); } }
    if (S.r3 && !(cv && none)) {
      const Fx = cv ? xl - f : xl + f, y3 = T.y + (cy - T.y) * (xl - T.x) / (Fx - T.x);
      if (Math.abs(y3 - cy) < 104) { const P = { x: xl, y: y3 }; s += arrow(T.x, T.y, P.x, P.y, 'o', 2); if (real) s += arrow(P.x, P.y, tip.x, P.y, 'r', 2.2); else { s += arrow(P.x, P.y, P.x + ext, P.y, 'r', 2.2); if (tip) s += line(P.x, P.y, tip.x, P.y, 'r', 1.5, 'stroke-dasharray="5 4"'); } }
    }

    setG(host, s);
    let msg;
    if (!cv) msg = '凹透鏡：不論物體在哪裡，像都是<b>正立、縮小的虛像</b>（在物體同側），屏幕上接不到。';
    else if (none) msg = '物體剛好在<b>焦點</b>上：折射後變成平行光，<b>不成像</b>。';
    else if (S.u > 2.02) msg = '物在 <b>2F 外</b>：<b>倒立、縮小的實像</b>，像在 F～2F 之間。';
    else if (S.u > 1.98) msg = '物剛好在 <b>2F</b>：<b>倒立、等大的實像</b>，像也在 2F。';
    else if (S.u > 1) msg = '物在 <b>F～2F 之間</b>：<b>倒立、放大的實像</b>，像在 2F 以外。';
    else msg = '物在<b>焦點內</b>：<b>正立、放大的虛像</b>（放大鏡），像和物同側，屏幕上接不到。';
    Q(host, 'out').innerHTML = `u ＝ ${S.u} f。${msg}` + (tip ? `<br>像的大小約是物的 <b>${round(Math.abs(m), 2)}</b> 倍。` : '');
  };
  $$('[data-l]', host).forEach(b => b.onclick = () => { S.kind = b.dataset.l; $$('[data-l]', host).forEach(x => x.classList.toggle('on', x === b)); draw(); });
  Q(host, 'u').oninput = () => { S.u = +Q(host, 'u').value; draw(); };
  $$('[data-k^=r]', host).forEach(c => c.onchange = draw);
  dragOn(Q(host, 'svg'), p => { S.u = sg(Math.round((xl - p.x) / f / .05) * .05, .3, 3.4); draw(); });
  draw();
};

/* --- 色光混合、透明物體與不透明物體的顏色 --- */
SIMS.simColor = host => {

  const filter = mode === 'filter', LIGHTS = ['白', '紅', '綠', '藍'], ITEMS = filter ? ['紅', '綠', '藍', '無色'] : ['紅', '綠', '藍', '白', '黑'];

  const SET = { '白': 'RGB', '紅': 'R', '綠': 'G', '藍': 'B', '無色': 'RGB', '黑': '' };
  const HEX = s => `rgb(${s.includes('R') ? 255 : 0},${s.includes('G') ? 255 : 0},${s.includes('B') ? 255 : 0})`;
  const NAME = { '': '黑色（沒有光）', R: '紅色', G: '綠色', B: '藍色', RG: '黃色', GB: '青色', RB: '洋紅色', RGB: '白色' };

  const draw = () => {

    s += `<polygon points="86,100 ${filter ? 190 : 250},${filter ? 70 : 90} ${filter ? 190 : 250},${filter ? 150 : 130} 86,120" fill="${S.l === '白' ? '#fff' : HEX(ls)}" opacity=".35"/>`;
    const pc = S.p === '無色' ? 'rgba(255,255,255,.25)' : S.p === '白' ? '#fff' : S.p === '黑' ? '#000' : HEX(SET[S.p]);
    if (filter) {
      s += `<rect x="190" y="50" width="22" height="120" fill="${pc}" stroke="#fff" stroke-width="2" opacity="${S.p === '無色' ? 1 : .85}"/>` + text(201, 190, '玻璃紙', '#fff', 13);
      s += `<polygon points="212,${rs ? 70 : 85} 360,${rs ? 60 : 85} 360,${rs ? 160 : 135} 212,${rs ? 150 : 135}" fill="${rs ? HEX(rs) : 'none'}" opacity=".45"/>`;
      s += `<rect x="370" y="60" width="110" height="100" rx="8" fill="${rs ? HEX(rs) : '#050505'}" stroke="#777" stroke-width="2"/>` + text(425, 184, '穿過後看到', '#fff', 13);
    } else {
      s += `<rect x="250" y="55" width="26" height="110" fill="${pc}" stroke="#bbb" stroke-width="2"/>` + text(263, 184, S.p + '紙', '#fff', 13);
      s += `<polygon points="276,${rs ? 80 : 95} 400,${rs ? 100 : 105} 400,${rs ? 130 : 125} 276,${rs ? 140 : 125}" fill="${rs ? HEX(rs) : 'none'}" opacity=".5"/>`;
      s += `<circle cx="430" cy="115" r="18" fill="#fff"/><circle cx="436" cy="115" r="7" fill="#222"/>` + text(430, 160, '眼睛看到', '#fff', 13);
      s += `<rect x="395" y="30" width="70" height="26" rx="6" fill="${rs ? HEX(rs) : '#050505'}" stroke="#777" stroke-width="2"/>`;
    }
    ['R', 'G', 'B'].forEach((c, i) => { const on = ls.includes(c), pass = rs.includes(c), x = 330 + i * 50; s += `<rect x="${x}" y="188" width="30" height="22" rx="4" fill="${on ? HEX(c) : '#333'}" opacity="${pass ? 1 : on ? .3 : .15}" stroke="#fff" stroke-width="${pass ? 3 : 1}"/>` + text(x + 15, 204, c === 'R' ? '紅' : c === 'G' ? '綠' : '藍', '#fff', 12); });
    setG(host, s);
    const why = filter ? (S.p === '無色' ? '無色透明玻璃紙讓所有色光穿透。' : `${S.p}色玻璃紙只讓${S.p}光穿透，其他色光被吸收。`) : (S.p === '白' ? '白紙反射所有色光。' : S.p === '黑' ? '黑紙吸收所有色光。' : `${S.p}紙只反射${S.p}光，其他色光被吸收。`);
    Q(host, 'out').innerHTML = `${S.l}光 ${filter ? '穿過' : '照到'} ${S.p}${filter ? (S.p === '無色' ? '（透明）' : '色') + '玻璃紙' : '紙'}：${why}<br>${filter ? '穿過去的' : '反射出來的'}光是 → <b>${NAME[rs] || '黑色'}</b>${rs ? '' : '（沒有光，看起來是黑的）'}。`;
  };
  $$('[data-l]', host).forEach(b => b.onclick = () => { S.l = b.dataset.l; $$('[data-l]', host).forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $$('[data-p]', host).forEach(b => b.onclick = () => { S.p = b.dataset.p; $$('[data-p]', host).forEach(x => x.classList.toggle('on', x === b)); draw(); });

};
function colorMix(host) {
  simBox(host, '色光混合', '紅、綠、藍三盞燈照在同一面白牆上。開關不同的燈，重疊的地方是什麼顏色？',
    `<div class="ctl"><label><input type="checkbox" data-k="R" checked> 紅燈</label><label><input type="checkbox" data-k="G" checked> 綠燈</label><label><input type="checkbox" data-k="B" checked> 藍燈</label></div><canvas data-k="cv" width="480" height="240" style="width:100%;max-width:480px;background:#000;border:1px solid var(--line);border-radius:10px;display:block"></canvas><div class="out" data-k="out"></div>`);
  const cv = Q(host, 'cv'), ctx = cv.getContext('2d'), NAME = { '': '沒有光（黑）', R: '紅', G: '綠', B: '藍', RG: '黃（紅＋綠）', GB: '青（綠＋藍）', RB: '洋紅（紅＋藍）', RGB: '白（紅＋綠＋藍）' };
  const draw = () => {
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 480, 240); ctx.globalCompositeOperation = 'lighter';
    const on = ['R', 'G', 'B'].filter(c => Q(host, c).checked);
    [['R', 190, 100, '#ff0000'], ['G', 290, 100, '#00ff00'], ['B', 240, 160, '#0000ff']].forEach(([c, x, y, col]) => { if (on.includes(c)) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 74, 0, 7); ctx.fill(); } });
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText('紅', 120, 70); ctx.fillText('綠', 350, 70); ctx.fillText('藍', 228, 232);
    Q(host, 'out').innerHTML = `開著的燈：${on.length ? on.map(c => ({ R: '紅', G: '綠', B: '藍' })[c]).join('、') : '（全關）'}。三原色疊在一起，中間看到：<b>${NAME[on.join('')]}</b>。${on.length === 3 ? '<br>紅、綠、藍三種色光等量相加，得到白光。' : ''}`;
  };
  $$('input', host).forEach(i => i.onchange = draw); draw();
}

/* ===== 應用主程式：身分、紀錄回傳、首頁、檢核、複習、路由 ===== */
const SELF = ['我覺得我會', '不太確定', '我覺得還不會'];
const ident = () => store.get('ident', null);
const who = () => { const m = ident(); return m ? m.cls + '-' + m.seat : 'anon'; };
const TS = { get: id => store.get('t:' + who() + ':' + id, {}), set: (id, v) => store.set('t:' + who() + ':' + id, v) };
const passedN = () => TASKS.filter(t => TS.get(t.id).passed).length;

const go = h => { location.hash = h; };

/* ---------- 紀錄回傳（Google 試算表，離線時先存起來） ---------- */
let flushTimer = null, flushing = false;
function sendRecord(rec, now = false) {
  const me = ident(); if (!me) return;
  rec = { exam: EXAM, time: new Date().toISOString(), rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), cls: me.cls, seat: me.seat, ...rec };
  let q = store.get('outbox', []);
  if (rec.kind === 'prog') q = q.filter(r => !(r.kind === 'prog' && r.task === rec.task && r.cls === rec.cls && r.seat === rec.seat));
  q.push(rec); store.set('outbox', q);
  if (now) flushOutbox(); else if (!flushTimer) flushTimer = setTimeout(flushOutbox, 20000);
}
async function flushOutbox(keepalive = false) {
  clearTimeout(flushTimer); flushTimer = null;
  if (!SHEET_URL || flushing || FILE_MODE) return;
  const q = store.get('outbox', []); if (!q.length) return;
  flushing = true;
  try {
    await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', keepalive, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(q) });
    const sent = new Set(q.map(r => r.rid));
    store.set('outbox', store.get('outbox', []).filter(r => !sent.has(r.rid)));
  } catch (e) { /* 離線時下次再送 */ }
  flushing = false;
}
window.addEventListener('online', () => flushOutbox());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushOutbox(true); });

/* ---------- 共用元件 ---------- */
function statusOf(t) {
  const s = TS.get(t.id);
  if (s.passed) return { cls: 'ok', txt: '✅ 通過', done: true };
  if ((s.miss || 0) >= 2) return { cls: 'hint', txt: '💡 建議先複習', hint: true };
  if (s.n) return { cls: 'go', txt: `連對 ${s.streak || 0}/${PASS}` };
  return { cls: 'no', txt: '⬜ 未開始' };
}
function identCard() {
  const me = ident();

  if (me) return `<div class="card ident">👤 <b>${me.cls} 班 ${me.seat} 號</b>　<button class="btn" id="idEdit">修改</button></div>`;

  const q = t.gen(); window.__q = q;
  let h = head + `<div class="streak">${Array.from({ length: PASS }, (_, i) => `<i class="${i < (s.streak || 0) ? 'on' : ''}"></i>`).join('')}<span>連續答對 ${s.streak || 0} / ${PASS}${s.passed ? '　（已通過，現在是加練）' : ''}</span></div>`;
  if (!s.passed && (s.miss || 0) >= 2) h += `<div class="rv-box">💡 你連續答錯 ${s.miss} 題了。先去看一下複習卡（約 3～5 分鐘），再回來做題，連對的進度會保留。<div class="row"><a class="btn warn" href="#/r/${id}?from=${id}">📖 先去看複習卡</a></div></div>`;
  h += `<div class="card"><p class="q-stem">${q.stem}</p>${q.svg ? `<div class="svgbox">${q.svg}</div>` : ''}`;
  if (q.type === 'num') h += `<div class="row"><input class="in wide" id="tAns" autocomplete="off" inputmode="decimal" placeholder="輸入答案">${q.unit ? `<span>${q.unit}</span>` : ''}<button class="btn primary" id="tGo">送出</button></div>${q.hint ? `<p class="muted">${q.hint}</p>` : ''}`;
  else {
    const order = q.fixed ? q.opts.map((_, i) => i) : shuffle(q.opts.map((_, i) => i));
    h += `<p class="step">${q.type === 'tt' ? '① 答案：' : ''}</p><div class="q-opts" id="tO">${order.map(i => `<button class="q-opt" data-i="${i}">${q.opts[i]}</button>`).join('')}</div>`;
    if (q.type === 'tt') { const ro = shuffle(q.ropts.map((_, i) => i)); h += `<p class="step">② 理由：</p><div class="q-opts" id="tR">${ro.map(i => `<button class="q-opt" data-i="${i}">${q.ropts[i]}</button>`).join('')}</div>`; }
    h += `<div class="row"><button class="btn primary" id="tGo" disabled>送出</button></div>`;
  }
  h += `<div class="fb" id="tFb" hidden></div></div><div class="row"><a class="btn" href="#/check">← 回檢核總覽</a><a class="btn" href="#/r/${id}?from=${id}">📖 卡住了？看複習卡</a></div>`;
  host.innerHTML = h;

  let pa = null, pr = null;
  const ready = () => { $('#tGo').disabled = pa == null || (q.type === 'tt' && pr == null); };
  $$('#tO .q-opt', host).forEach(b => b.onclick = () => { $$('#tO .q-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); pa = +b.dataset.i; ready(); });
  $$('#tR .q-opt', host).forEach(b => b.onclick = () => { $$('#tR .q-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); pr = +b.dataset.i; ready(); });
  const inp = $('#tAns'); if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') $('#tGo').click(); }; }
  $('#tGo').onclick = () => {
    let ok, why = '';
    if (q.type === 'num') {
      const v = inp.value; if (!v.trim()) return;
      if (isNaN(parseNum(v))) { const fb = $('#tFb'); fb.hidden = false; fb.className = 'fb no'; fb.innerHTML = '<b>請輸入數字</b>　只能輸入數字（可以有小數點）。這次不算答錯，改好再送出。'; inp.focus(); return; }
      ok = near(parseNum(v), q.ans, 1e-4, 1e-9);
    } else {
      ok = pa === q.a && (q.type !== 'tt' || pr === q.ra);
      if (!ok && q.type === 'tt' && pa === q.a) why = '答案對了，但理由不對，這題不算過關。';
      $$('#tO .q-opt').forEach(b => { b.disabled = true; b.classList.remove('sel'); if (+b.dataset.i === q.a) b.classList.add('is-right'); else if (+b.dataset.i === pa) b.classList.add('is-wrong'); });
      $$('#tR .q-opt').forEach(b => { b.disabled = true; b.classList.remove('sel'); if (+b.dataset.i === q.ra) b.classList.add('is-right'); else if (+b.dataset.i === pr) b.classList.add('is-wrong'); });
    }
    if (inp) inp.disabled = true;
    const cur = TS.get(id), streak = ok ? (cur.streak || 0) + 1 : 0, n = (cur.n || 0) + 1, miss = ok ? 0 : (cur.miss || 0) + 1;
    const nowPass = !cur.passed && streak >= PASS;
    TS.set(id, { ...cur, streak, n, miss, wrongN: (cur.wrongN || 0) + (ok ? 0 : 1), passed: cur.passed || nowPass, passAt: nowPass ? new Date().toISOString() : cur.passAt, passN: nowPass ? n : cur.passN });
    if (!ok) {
      let given, right, kind;
      if (q.type === 'num') { given = inp.value.trim(); right = fmtPlain(q.ans) + (q.unit ? ' ' + q.unit : ''); kind = '數值錯'; }
      else {
        given = strip(q.opts[pa]) + (q.type === 'tt' ? '／理由：' + strip(q.ropts[pr]) : '');
        right = strip(q.opts[q.a]) + (q.type === 'tt' ? '／理由：' + strip(q.ropts[q.ra]) : '');
        kind = q.type !== 'tt' ? '答案錯' : pa === q.a ? '答案對、理由錯' : pr === q.ra ? '答案錯、理由對' : '答案和理由都錯';
      }
      sendRecord({ kind: 'wrong', task: id, tag: q.tag || id, err: kind, given: given.slice(0, 120), right: right.slice(0, 120), n });
    }
    if (!cur.passed || nowPass) sendRecord({ kind: 'prog', task: id, name: t.can, n, streak, passed: !!(cur.passed || nowPass), self: SELF[cur.self] });
    if (nowPass) sendRecord({ kind: 'pass', task: id, name: t.can, tries: n, self: SELF[cur.self] }, true);
    const fb = $('#tFb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<b>${ok ? '✓ 答對了！' : '✗ 還差一點'}</b>${why ? `<p>${why}</p>` : ''}${!ok && q.type === 'num' ? `<p>正確答案：${fmt(q.ans)}${q.unit ? ' ' + q.unit : ''}</p>` : ''}<p>${q.exp}</p>` +
      (!ok ? `<div class="rv-box" style="margin-top:8px">📖 這個地方還不穩？<a class="btn warn" href="#/r/${id}?from=${id}">看「${t.id}」複習卡</a>${miss >= 2 ? ' <b>（連錯 ' + miss + ' 題了，建議先複習）</b>' : ''}</div>` : '');
    const gb = $('#tGo'); gb.disabled = false;
    if (nowPass) {
      gb.remove();
      const nxt = TASKS.find(x => !TS.get(x.id).passed && x.id !== id);
      fb.insertAdjacentHTML('afterend', `<div class="pass-box">🎉 <b>${t.id} 通過！</b><p>作答前你覺得「${SELF[cur.self]}」，實際用了 <b>${n}</b> 題達成連續答對 ${PASS} 題。${n === PASS ? '一次到位，觀念很穩！' : ''}</p>
        <div class="row"><a class="btn primary" href="#/check">回檢核總覽</a>${nxt ? `<a class="btn ok" href="#/t/${nxt.id}">下一個：${nxt.id} →</a>` : ''}<button class="btn" id="tMore">再加練一題</button></div></div>`);
      $('#tMore').onclick = () => viewTask(id);
    } else { gb.textContent = '下一題 →'; gb.onclick = () => viewTask(id); gb.focus(); }
    $('.streak', host).outerHTML = `<div class="streak">${Array.from({ length: PASS }, (_, i) => `<i class="${i < streak ? 'on' : ''}"></i>`).join('')}<span>連續答對 ${streak} / ${PASS}</span></div>`;
    updateTop();
  };
}
const fmtPlain = x => String(round(x, 6));

/* ---------- 複習：地圖與卡片 ---------- */
function viewReviewMap() {
  let h = `<h2>📖 複習</h2><p class="muted">每個概念一張複習卡：先看「我要會什麼」，再看重點、互動模擬、容易搞錯的地方。讀完按「去做題」檢查自己有沒有真的懂。<br>顏色：<span style="color:var(--good);font-weight:700">綠＝已通過</span>、<span style="color:var(--warn);font-weight:700">黃＝建議先複習</span>。</p>`;
  [3, 4].forEach(ch => {
    h += `<div class="ch-h c${ch}">第 ${ch} 章　${ch === 3 ? '波動與聲音' : '光、影像與顏色'}</div>`;
    SECS.filter(s => s.ch === ch).forEach(sec => {
      h += `<div class="map-sec"><div class="sec-h"><h3>${sec.name}</h3></div><div class="mp">`;
      TASKS.filter(t => t.sec === sec.id).forEach(t => {
        const st = statusOf(t);
        h += `<a class="${ch === 4 ? 'c4' : ''} ${st.done ? 'done' : st.hint ? 'sugg' : ''}" href="#/r/${t.id}"><span class="id">${t.id}</span><span>${t.can}<br><span class="st ${st.cls}">${st.txt}</span></span></a>`;
      });
      h += `</div></div>`;
    });
  });
  $('#view').innerHTML = h;
}
const seenRv = new Set();
function viewCard(id, from) {
  const t = TASK[id], c = CARDS[id], host = $('#view');
  if (!t) return go('#/review');
  const st = statusOf(t), i = TASKS.indexOf(t), prev = TASKS[i - 1], next = TASKS[i + 1];
  let body = c ? (typeof c.body === 'function' ? c.body() : c.body) : '<p>（這張複習卡還在準備中）</p>';
  body = body.replace(/\{\{sim:(\w+)(?::(\w+))?\}\}/g, (_, n, m) => `<div class="sim" data-sim="${n}" data-mode="${m || ''}"></div>`);
  let h = `<div class="rcard"><div class="row" style="margin:0"><a class="btn" href="#/review">← 複習地圖</a><span class="chip ${t.ch === 4 ? 'c4' : ''}">${t.id}｜${secName(t.sec)}</span><span class="st ${st.cls}">${st.txt}</span></div>
    <h2>我能${t.can}</h2><p class="muted">學習內容 ${t.lc}</p>`;
  if (from && TASK[from]) h += `<div class="rv-box">你是從任務 <b>${from}</b> 過來的。看完下面的重點，按最底下的按鈕就能回去繼續做題（連對進度會保留）。</div>`;
  h += body;
  if (c && c.traps && c.traps.length) h += `<div class="trap"><b>⚠ 容易搞錯</b><ul>${c.traps.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  if (c && c.quick) h += c.quick.map(([q, a]) => `<details class="qc"><summary>自我檢查：${q}</summary><p>${a}</p></details>`).join('');
  h += `<div class="card" style="text-align:center"><p style="margin:0 0 8px"><b>讀完了嗎？</b>去做題檢查自己有沒有真的懂。</p><div class="row" style="justify-content:center"><a class="btn ok" href="#/t/${id}">${from === id || st.cls === 'go' || st.hint ? '✅ 我看懂了，回去做題' : '🎯 去做這個概念的題目'}</a></div></div>`;
  h += `<div class="nav2">${prev ? `<a class="btn" href="#/r/${prev.id}${from ? '?from=' + from : ''}">← ${prev.id} ${prev.can.slice(0, 12)}…</a>` : '<span></span>'}${next ? `<a class="btn" href="#/r/${next.id}${from ? '?from=' + from : ''}">${next.id} ${next.can.slice(0, 12)}… →</a>` : ''}</div></div>`;
  host.innerHTML = h;
  $$('.sim[data-sim]', host).forEach(el => { const f = SIMS[el.dataset.sim]; if (f) f(el); else el.innerHTML = '<p class="muted">（模擬準備中）</p>'; });
  const key = id + '|' + (from || '');
  if (ident() && !seenRv.has(key)) { seenRv.add(key); sendRecord({ kind: 'rv', task: id, from: from || '' }); }
}

/* ---------- 路由 ---------- */
function route() {
  const raw = location.hash.replace(/^#\/?/, ''), [path, qs] = raw.split('?'), parts = path.split('/');
  const from = qs && (qs.match(/from=([A-Z]\d+)/) || [])[1];
  window.scrollTo(0, 0);
  if (parts[0] === 'check') viewBoard();
  else if (parts[0] === 't') viewTask(parts[1]);
  else if (parts[0] === 'review') viewReviewMap();
  else if (parts[0] === 'r') viewCard(parts[1], from);
  else viewHome();
  updateTop();
}
window.addEventListener('hashchange', route);
route();
flushOutbox();

</script></body></html>
